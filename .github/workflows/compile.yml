# Compiles both sketches for the exact board on every push: a green check means they will upload.
# Compiler errors are posted as annotations on the run, so they show up without digging through the log.
name: Compile firmware

on: [push, pull_request, workflow_dispatch]

env:
  # ESP32S3 Dev Module with the Waveshare settings: 16MB flash, OPI PSRAM, USB CDC on boot, 3MB app partition
  FQBN: esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc,PartitionScheme=app3M_fat9M_16MB
  ESP32_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  # Pinned: ESP32 core 4.x breaks the GFX display library (as of Nov 2026). Use the same version in the Arduino IDE.
  ESP32_CORE: esp32:esp32@3.3.13

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and display library
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install "$ESP32_CORE" --additional-urls "$ESP32_URL"
          arduino-cli lib install "GFX Library for Arduino"
      - name: Compile sketches
        run: |
          status=0
          for s in starboy hwtest; do
            echo "=== $s ==="
            if arduino-cli compile --fqbn "$FQBN" "$s" > "$s.log" 2>&1; then
              tail -n 3 "$s.log"
            else
              status=1
              cat "$s.log"
              grep -E "error:" "$s.log" | head -n 10 | while IFS= read -r line; do echo "::error title=$s::$line"; done
            fi
          done
          exit $status
