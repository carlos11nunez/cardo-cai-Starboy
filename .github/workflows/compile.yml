# Compiles both sketches for the exact board on every push: a green check means they will upload.
name: Compile firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          # ESP32S3 Dev Module with the Waveshare settings: 16MB flash, OPI PSRAM, USB CDC on boot, 3MB app partition
          fqbn: esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,CDCOnBoot=cdc,PartitionScheme=app3M_fat9M_16MB
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: GFX Library for Arduino
          sketch-paths: |
            - starboy
            - hwtest
