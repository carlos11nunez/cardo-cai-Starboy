<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starboy Preview</title>
<style>
  body { margin: 0; background: #1b1b1f; color: #ddd; font: 14px system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px; }
  .bezel { background: #0a0a0a; border-radius: 50%; padding: 14px; box-shadow: 0 0 0 3px #333, 0 8px 30px #000; }
  canvas { display: block; border-radius: 50%; width: min(466px, 80vw); height: min(466px, 80vw); cursor: pointer; touch-action: none; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { background: #2b2b33; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 160px; height: 6px; margin: 0;
         border-radius: 3px; cursor: pointer; --pct: 80%; --fill: #3c3;
         background: linear-gradient(to right, var(--fill) var(--pct), #3a3a42 var(--pct)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #eee; border: none; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #eee; border: none; }
  input[type=range]:focus-visible { outline: 2px solid #888; outline-offset: 4px; }
  #batv { display: inline-block; min-width: 4ch; font-variant-numeric: tabular-nums; }
  label { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div class="bezel"><canvas id="c" width="466" height="466"></canvas></div>
<div class="row">
  <button id="shake">Shake</button>
  <label><input id="bat" type="range" min="3.3" max="4.2" step="0.01" value="4.0" aria-label="Battery"> <span id="batv"></span></label>
</div>
<script>
// Mirrors starboy.ino - keep them in sync.
const W = 466, cv = document.getElementById('c'), g = cv.getContext('2d');
const CAT=0, WIDE=1, SHOCKED=2, ROUND=3, STARP=4, SLEEPY=5, LOWBAT=6;
const NAMES = ['CAT','WIDE','SHOCKED','ROUND','STARP','SLEEPY','LOWBAT'];
const TAP_CYCLE = [CAT, WIDE, SHOCKED, ROUND, STARP];
const LEFT_EYE = [152, 255, 152], RIGHT_EYE = [0x17, 0x39, 0xD1]; // mint, #1739d1
const PUPIL_SHADE = 0.4; // pupil = darker shade of its own eye
const LOOKS = [ // rx, ry, tilt, asym, prx, pry, pox, poy, lid, slant, bright
  [88,112,12,1.08,18,72, 0,  0,0.00,0.00,1.0],  [80,100,6,1.05,28,54, 0,  0,0.00,0.00,1.0],
  [78, 92, 3,1.10, 6, 7, 0,  0,0.00,0.00,1.0],  [95, 85,0,1.03,50,50,26,  2,0.22,0.15,1.0],
  [78,108,14,0.85,14,60, 0,  0,0.00,0.00,1.0],  // STARP: left big star pupil, right smaller eye with cat slit
  [92, 85, 0,1.00,46,46,20,-10,0.50,0.10,0.8],  [88, 80,0,1.00,40,40,15, -5,0.60,0.10,0.45]];
// Random animations: one every ANIM_EVERY_MS, idle look-around in between
const ANIM_EVERY_MS = 8000;
const A_NONE = -1, A_DOUBLE_BLINK = 0, A_EYE_ROLL = 1, A_WINK = 2, A_SQUINT = 3, A_SURPRISE = 4, A_HOP = 5,
      A_LOVE = 6, A_HAPPY = 7, A_SHY = 8, A_LEAN = 9, A_DIZZY = 10;
const ANIM_DUR = [1200,1400, 900, 2000, 1000, 900, 2500, 1500, 1800, 1600, 0]; // ms; dizzy reuses the shake effect
let animHappy = 0, animLean = 0, loveP = -1;
const DOUBLE_TAP_MS = 350;
// Star mode shake: eyes shrink and ricochet off the round display edge
const BOUNCE_MS = 3500, BOUNCE_SPEED = 700;
let bx = 0, by = 0, bvx = 0, bvy = 0, faceScale = 1, bounceUntil = 0, lastFrame = 0;
function startBounce(now) {
  const a = Math.random() * Math.PI * 2;
  bvx = Math.cos(a) * BOUNCE_SPEED; bvy = Math.sin(a) * BOUNCE_SPEED; bounceUntil = now + BOUNCE_MS;
}
function updateBounce(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  const on = now < bounceUntil;
  faceScale = lerp(faceScale, on ? 0.6 : 1, 0.12);
  if (!on) { bx = lerp(bx, 0, 0.1); by = lerp(by, 0, 0.1); return; }
  bx += bvx * dt; by += bvy * dt;
  const r = 110 * faceScale;
  for (const s of [-1, 1]) {
    const ex = bx + s * 106 * faceScale, ey = by - 8, d = Math.hypot(ex, ey), lim = 229 - r;
    if (d > lim) {
      const nx = ex / d, ny = ey / d, vn = bvx * nx + bvy * ny;
      if (vn > 0) { bvx -= 2 * vn * nx; bvy -= 2 * vn * ny; }
      bx -= nx * (d - lim); by -= ny * (d - lim);
    }
  }
}
let tapAt = 0;
let anim = A_NONE, animStart = 0, nextAnim = ANIM_EVERY_MS, animBlinkL = 0, animBlinkR = 0, animHop = 0;
const tri = x => 1 - Math.abs(2 * x - 1); // 0 -> 1 -> 0 as x goes 0..1
let cur = [...LOOKS[CAT]], cycleIdx = 0, mood = CAT;
const IDLE_MS = 3000, WOBBLE = 0.03, CROSS_CHANCE = 15, RIGHT_EYE_DROP = 7, SWAY_PX = 12, SWAY_TILT = 10, DIZZY_SPEED = 7.0, STAR_COUNT = 3, STAR_PUPIL_R = 56;
let shakeAmp = 0, headTilt = 0;
let lookLX = 0, lookLY = 0, lookRX = 0, lookRY = 0, tiltX = 0, tiltY = 0;
let idleX = 0, idleY = 0, cross = 0, crossTarget = 0, lastActive = 0, nextSaccade = 0;
let dizzyUntil = 0, nextBlink = 0, blinkStart = 0, touchStart = 0, batteryShowUntil = 0;
let touching = false, longPressFired = false, batteryPct = 80;

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

function batteryPercent(v) {
  const vs = [3.30,3.60,3.70,3.75,3.80,3.90,4.00,4.10,4.20], ps = [0,5,15,30,45,65,80,92,100];
  if (v <= vs[0]) return 0;
  for (let i = 1; i < 9; i++) if (v <= vs[i]) return Math.floor(ps[i-1] + (ps[i]-ps[i-1]) * (v-vs[i-1]) / (vs[i]-vs[i-1]));
  return 100;
}

function fillRotEllipse(cx, cy, rx, ry, deg, rgb, b) {
  g.fillStyle = `rgb(${rgb[0]*b},${rgb[1]*b},${rgb[2]*b})`;
  g.beginPath(); g.ellipse(cx, cy, rx, ry, deg * Math.PI / 180, 0, Math.PI * 2); g.fill();
}

function drawEye(cx, cy, left, lx, ly, blink, t) {
  const [crx, cry, ctilt, asym, cprx, cpry, pox, poy, clid, cslant, b] = cur;
  const k = (left ? 1 : asym) * faceScale, ph = left ? 0 : 2.1;
  const rx = crx * k * (1 + WOBBLE * Math.sin(t * 1.3 + ph));
  const ry = cry * k * (1 + WOBBLE * Math.sin(t * 1.7 + ph + 1));
  const prx = cprx * k, pry = cpry * k;
  const tilt = (left ? ctilt + 2 : -ctilt - 1) + headTilt, inward = left ? 1 : -1;
  const col = left ? LEFT_EYE : RIGHT_EYE;
  fillRotEllipse(cx, cy, rx, ry, tilt, col, b);

  // pupil, clipped to the eye outline
  const star = mood === STARP && left;
  const sr = STAR_PUPIL_R * faceScale * (1 + 0.06 * Math.sin(t * 3));
  const reachX = star ? (rx - sr) * 0.5 : (rx - prx * 0.5) * 0.6, reachY = star ? (ry - sr) * 0.5 : (ry - pry * 0.5) * 0.6;
  const px = cx + inward * (pox * k + cross * rx * 0.35) + lx * reachX;
  const py = cy + poy * k + ly * reachY;
  g.save(); g.beginPath(); g.ellipse(cx, cy, rx, ry, tilt * Math.PI / 180, 0, Math.PI * 2); g.clip();
  if (star) drawStar(px, py, sr, 0.3 + 0.45 * Math.sin(t * 1.3), `rgb(${col.map(c => c * b * PUPIL_SHADE)})`);
  else fillRotEllipse(px, py, prx, pry, tilt, col, b * PUPIL_SHADE);
  g.restore();
  if (animHappy > 0.01) fillRotEllipse(cx, cy + ry * (2.2 - 1.6 * animHappy), rx * 1.15, ry, tilt, [0, 0, 0], 1); // happy ^ ^

  const lid = clid + (1 - clid) * blink, slant = cslant * (1 - blink);
  if (lid > 0.01 || slant > 0.01) {
    const top = cy - ry - 4, h = 2 * ry + 8;
    const xIn = cx + inward * (rx + 8), xOut = cx - inward * (rx + 8);
    g.fillStyle = '#000'; g.beginPath();
    g.moveTo(xOut, 0); g.lineTo(xIn, 0); g.lineTo(xIn, top + lid * h); g.lineTo(xOut, top + Math.min(1, lid + slant) * h);
    g.closePath(); g.fill();
  }
}

function drawStar(cx, cy, r, rot, color) {
  g.fillStyle = color; g.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.45 : r, a = rot + i * Math.PI / 5 - Math.PI / 2;
    g.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a));
  }
  g.closePath(); g.fill();
}

function drawDizzyStars(t) {
  if (shakeAmp < 0.02) return;
  const fade = Math.min(1, shakeAmp * 3);
  for (let k = 0; k < STAR_COUNT; k++) {
    const b = t * 3 + k * Math.PI * 2 / STAR_COUNT, depth = (Math.sin(b) + 1) / 2;
    drawStar(233 + 120 * Math.cos(b), 92 + 20 * Math.sin(b), (8 + 7 * depth) * fade, t * 5 + k, 'rgb(255,220,60)');
  }
}

function drawHeart(x, y, s, color) {
  g.fillStyle = color; g.beginPath();
  g.arc(x - s * 0.5, y, s * 0.55, 0, Math.PI * 2); g.arc(x + s * 0.5, y, s * 0.55, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.moveTo(x - s * 1.03, y + s * 0.2); g.lineTo(x + s * 1.03, y + s * 0.2); g.lineTo(x, y + s * 1.4); g.fill();
}

function drawLoveHearts(t) {
  if (loveP < 0) return;
  for (let i = 0; i < 6; i++) {
    const q = loveP * 1.6 - i * 0.12;
    if (q <= 0 || q >= 1) continue;
    const x = 233 + (i % 2 ? 1 : -1) * (70 + 25 * (i % 3)) + 10 * Math.sin(t * 5 + i);
    drawHeart(x, 290 - q * 230, 13 * (1 - q * 0.5), 'rgb(235,50,70)');
  }
}

function drawBattery(cx, cy, pct, showText) {
  const c = pct <= 15 ? '#f00' : pct <= 40 ? '#ff0' : '#0f0';
  g.strokeStyle = '#fff'; g.lineWidth = 1; g.beginPath(); g.roundRect(cx-40, cy-18, 76, 36, 6); g.stroke();
  g.fillStyle = '#fff'; g.fillRect(cx+36, cy-8, 6, 16);
  g.fillStyle = c; g.fillRect(cx-36, cy-14, Math.floor(68*pct/100), 28);
  if (showText) { g.fillStyle = '#fff'; g.font = 'bold 32px monospace'; g.textAlign = 'center'; g.fillText(pct + '%', cx, cy + 64); }
}

function drawFrame(now) {
  const t = now / 1000;
  let blink = 0;
  if (now >= nextBlink) { blinkStart = now; nextBlink = now + rand(2000, 6000); }
  const bt = now - blinkStart;
  if (bt < 150) blink = bt < 75 ? bt / 75 : (150 - bt) / 75;
  if (mood === SLEEPY || mood === LOWBAT) blink = Math.max(blink, 0.1 + 0.1 * Math.sin(t * 1.5));

  g.fillStyle = '#000'; g.fillRect(0, 0, W, W);
  const ox = (lookLX + lookRX) * 9, oy = (lookLY + lookRY) * 7 + animHop;
  let sx = SWAY_PX * shakeAmp * Math.sin(t * 2.2);
  const sy = SWAY_PX * 0.4 * shakeAmp * Math.sin(t * 4.4);
  headTilt = SWAY_TILT * shakeAmp * Math.sin(t * 2.2);
  sx += 22 * animLean; headTilt += 16 * animLean; // lean animation
  const gap = 106 * faceScale;
  drawEye(233 - gap + ox + sx + bx, 225 + oy + sy + by, true, lookLX, lookLY, Math.max(blink, animBlinkL), t);
  drawEye(233 + gap + ox + sx + bx, 225 + oy + RIGHT_EYE_DROP + sy + by, false, lookRX, lookRY, Math.max(blink, animBlinkR), t);
  drawDizzyStars(t);
  drawLoveHearts(t);

  if (now < batteryShowUntil || (touching && longPressFired)) drawBattery(233, 370, batteryPct, true);
  else if (mood === LOWBAT && Math.floor(now / 600) % 2) drawBattery(233, 390, batteryPct, false);
}

function loop(now) {
  if (touching && !longPressFired && now - touchStart > 1000) longPressFired = true;
  // mood: low battery > tap choice. Dizzy keeps the current pupil style and just spins it.
  mood = batteryPct <= 15 ? LOWBAT : TAP_CYCLE[cycleIdx];
  const dizzy = now < dizzyUntil;
  // cartoon dizzy: pupils spin in opposite directions while the head sways; calms down over the 3 s
  let dzX = 0, dzY = 0;
  shakeAmp = 0;
  if (dizzy) {
    const amp = (dizzyUntil - now) / 3000, a = now / 1000 * DIZZY_SPEED;
    dzX = Math.cos(a) * amp; dzY = Math.sin(a) * amp;
    shakeAmp = amp;
  }
  // random animation every ANIM_EVERY_MS (skipped while dizzy, touched or low on battery)
  const tapAnim = tapAt && now - tapAt >= DOUBLE_TAP_MS;
  if (tapAnim) tapAt = 0;
  if (now >= nextAnim || tapAnim) {
    nextAnim = now + ANIM_EVERY_MS;
    if (!dizzy && !touching && mood !== LOWBAT && now >= bounceUntil) {
      anim = Math.floor(Math.random() * ANIM_DUR.length); animStart = now;
      if (anim === A_DIZZY) { dizzyUntil = now + 1800; anim = A_NONE; }
    }
  }
  const p = anim === A_NONE ? 1 : (now - animStart) / ANIM_DUR[anim];
  if (p >= 1) anim = A_NONE;
  const env = anim === A_NONE ? 0 : Math.sin(Math.PI * p);
  animBlinkL = animBlinkR = animHop = animHappy = animLean = 0;
  loveP = -1;
  let animGaze = false, agx = 0, agy = 0;
  switch (anim) {
    case A_DOUBLE_BLINK: { // two soft eased blinks with a pause between
      const q = p < 0.5 ? p / 0.3 : (p - 0.55) / 0.3, s = q > 0 && q < 1 ? Math.sin(Math.PI * q) : 0;
      animBlinkL = animBlinkR = s * s;
    } break;
    case A_EYE_ROLL: animGaze = true; agx = Math.cos(Math.PI - p * 2 * Math.PI) * 0.9; agy = -Math.sin(Math.PI - p * 2 * Math.PI) * 0.9; break;
    case A_WINK: animBlinkR = Math.min(1, tri(p) * 1.6); break;
    case A_SQUINT: animGaze = true; agx = Math.sin(p * 3 * Math.PI) * 0.8; break;
    case A_HOP: animHop = -Math.abs(Math.sin(p * 2 * Math.PI)) * 22; break;
    case A_LOVE: loveP = p; break;
    case A_HAPPY: animHappy = env; break;
    case A_SHY: animGaze = true; agx = -0.4; agy = 0.9; break;
    case A_LEAN: animLean = Math.sin(p * 2 * Math.PI); break;
  }

  const tg = [...LOOKS[mood]];
  if (dizzy) { tg[0] *= 0.9; tg[1] *= 1.15; tg[8] = 0; tg[9] = 0; } // surprised: open, taller + narrower (keeps a gap), same pupils
  if (anim === A_SQUINT) tg[8] = Math.max(tg[8], 0.45 * env);
  if (anim === A_SHY) tg[8] = Math.max(tg[8], 0.35 * env);
  if (anim === A_LOVE) tg[8] = Math.max(tg[8], 0.15 * env);
  if (anim === A_HAPPY) { tg[8] *= 1 - env; tg[9] *= 1 - env; } // lids open so the arch shows
  if (anim === A_SURPRISE) { tg[1] *= 1 + 0.25 * env; tg[8] *= 1 - env; tg[9] *= 1 - env; }
  cur = cur.map((v, i) => lerp(v, tg[i], 0.25));
  // idle: no mouse/touch for IDLE_MS -> eyes dart around (pointermove/pointerdown reset lastActive)
  if (touching || dizzy) lastActive = now;
  let gx = tiltX, gy = tiltY;
  if (now - lastActive > IDLE_MS) {
    if (now >= nextSaccade) {
      idleX = rand(-0.8, 0.8); idleY = rand(-0.6, 0.6);
      crossTarget = Math.random() * 100 < CROSS_CHANCE ? 1 : 0;
      nextSaccade = now + rand(600, 2500);
    }
    gx = idleX; gy = idleY;
  } else crossTarget = 0;
  if (crossTarget > 0) { gx *= 0.2; gy *= 0.2; }
  if (animGaze) { gx = agx; gy = agy; crossTarget = 0; }
  if (now < bounceUntil) { const sp = Math.hypot(bvx, bvy); gx = bvx / sp * 0.8; gy = bvy / sp * 0.8; crossTarget = 0; } // look where they fly
  let gRX = gx, gRY = gy;
  if (dizzy) { gx = dzX; gy = dzY; gRX = -dzX; gRY = dzY; } // mirrored spin
  const kl = dizzy ? 0.25 : 0.22, kr = dizzy ? 0.25 : 0.11;
  lookLX = lerp(lookLX, gx, kl); lookLY = lerp(lookLY, gy, kl);
  lookRX = lerp(lookRX, gRX, kr); lookRY = lerp(lookRY, gRY, kr);
  cross = lerp(cross, crossTarget, 0.1);
  updateBounce(now);
  drawFrame(now);
  requestAnimationFrame(loop);
}

// inputs standing in for touch / IMU / battery ADC
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  tiltX = clamp(((e.clientX - r.left) / r.width - 0.5) * 2, -1, 1);
  tiltY = clamp(((e.clientY - r.top) / r.height - 0.5) * 2, -1, 1);
  lastActive = performance.now();
});
cv.addEventListener('pointerleave', () => { tiltX = tiltY = 0; });
cv.addEventListener('pointerdown', () => { touching = true; touchStart = performance.now(); longPressFired = false; });
window.addEventListener('pointerup', () => {
  if (!touching) return;
  touching = false;
  if (longPressFired) batteryShowUntil = performance.now() + 2000;
  else {
    const now = performance.now();
    if (tapAt && now - tapAt < DOUBLE_TAP_MS) { cycleIdx = (cycleIdx + 1) % TAP_CYCLE.length; tapAt = 0; } // double tap
    else tapAt = now; // single tap: random animation once no second tap follows
  }
});
document.getElementById('shake').onclick = () => {
  const now = performance.now();
  if (mood !== STARP) dizzyUntil = now + 3000;
  else if (now >= bounceUntil) startBounce(now); // star mode: eyes ricochet instead
};
const bat = document.getElementById('bat');
const updBat = () => { batteryPct = batteryPercent(+bat.value); document.getElementById('batv').textContent = batteryPct + '%';
  bat.style.setProperty('--pct', (bat.value - bat.min) / (bat.max - bat.min) * 100 + '%');
  bat.style.setProperty('--fill', batteryPct <= 15 ? '#e33' : batteryPct <= 40 ? '#dc3' : '#3c3'); };
bat.oninput = updBat; updBat();

console.assert(batteryPercent(3.2) === 0 && batteryPercent(4.2) === 100 && batteryPercent(3.85) === 55, 'battery curve');
requestAnimationFrame(loop);
</script>
</body>
</html>
